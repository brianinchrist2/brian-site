<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程仪表盘 — 家教会的本体论革命</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/courseware.css">
<style>
/* ===== Site nav bar ===== */
.site-nav {
  position: sticky;
  top: 0;
  height: 52px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px) saturate(1.1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 500;
  padding: 0 20px;
}
.site-nav .nav-link {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
  position: relative;
  letter-spacing: 0.02em;
}
.site-nav .nav-link:hover { color: var(--accent); }
.site-nav .nav-link::after {
  content: "";
  position: absolute;
  left: 0; bottom: -5px;
  width: 0; height: 1.5px;
  background: var(--accent);
  transition: width 0.25s ease;
}
.site-nav .nav-link:hover::after { width: 100%; }
.site-nav .nav-link.active {
  color: var(--accent);
  font-weight: 600;
}
.site-nav .nav-link.active::after {
  width: 100%;
}
/* Courseware topbar below site nav */
.layout .topbar { top: 52px; }
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="nav-link">主页</a>
  <a href="../../organicchurch/" class="nav-link">文章</a>
  <a href="../index.html" class="nav-link">著作</a>
</nav>
  <div class="layout">
    <header class="topbar">
      <div class="topbar-brand">
        家教会的本体论革命
        <small>Interactive Courseware</small>
      </div>
      <nav class="topbar-nav">
        <a href="index.html" class="active">仪表盘</a>
        <a href="chapter.html">学习</a>
        <a href="review.html">复习</a>
      </nav>
    </header>

    <main class="container">
      <h1 class="visually-hidden">家教会的本体论革命 · 学习课件</h1>

      <a id="resume-btn" class="card resume-card" href="chapter.html" style="display: none;">
        <span class="btn-primary">继续学习</span>
      </a>

      <section class="card" aria-label="学习进度">
        <h2 class="section-title">总进度</h2>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="学习进度"></div>
        </div>
      </section>

      <section id="stats" class="card">
        <h2 class="section-title">学习统计</h2>
        <div class="stats-grid">
          <div class="stat-item"><span id="stat-completed">0/24</span><label>已完成</label></div>
          <div class="stat-item"><span id="stat-visited">0/24</span><label>已浏览</label></div>
          <div class="stat-item"><span id="stat-percent">0%</span><label>总进度</label></div>
          <div class="stat-item"><span id="stat-minutes">0</span><label>学习分钟</label></div>
        </div>
      </section>

      <section class="card" aria-label="导出与打印">
        <h2 class="section-title">导出与打印</h2>
        <div class="export-actions">
          <button id="export-md" type="button" class="btn-secondary">导出 Markdown</button>
          <button id="export-txt" type="button" class="btn-secondary">导出 TXT</button>
          <a href="print.html" class="btn-secondary">打印报告</a>
        </div>
      </section>

      <section class="catalog-section">
        <h2 class="section-title">章节目录</h2>
        <div id="parts-container"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/courseware-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
