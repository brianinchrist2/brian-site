<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习报告 — 打印视图</title>
  <link rel="stylesheet" href="assets/css/courseware.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: white; color: black; }
      .print-header { page-break-after: avoid; }
      .print-part { page-break-inside: avoid; }
      .print-chapter { page-break-inside: avoid; }
    }
  </style>
<style>
/* ===== Site nav bar ===== */
.site-nav {
  position: sticky;
  top: 0;
  height: 52px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px) saturate(1.1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 500;
  padding: 0 20px;
}
.site-nav .nav-link {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
  position: relative;
  letter-spacing: 0.02em;
}
.site-nav .nav-link:hover { color: var(--accent); }
.site-nav .nav-link::after {
  content: "";
  position: absolute;
  left: 0; bottom: -5px;
  width: 0; height: 1.5px;
  background: var(--accent);
  transition: width 0.25s ease;
}
.site-nav .nav-link:hover::after { width: 100%; }
.site-nav .nav-link.active {
  color: var(--accent);
  font-weight: 600;
}
.site-nav .nav-link.active::after {
  width: 100%;
}
/* Courseware topbar below site nav */
.layout .topbar { top: 52px; }
</style>
</head>
<body class="print-page">
  <div class="topbar no-print">
    <a class="nav-btn" href="index.html">← 返回仪表盘</a>
    <button id="print-btn" class="btn-primary" type="button">打印 / 另存为 PDF</button>
  </div>
  <main id="print-content"></main>
  <script src="assets/js/courseware-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/print.js"></script>
</body>
</html>
