<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>章节学习 — 家教会的本体论革命</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/courseware.css">
<style>
/* ===== Site nav bar ===== */
.site-nav {
  position: sticky;
  top: 0;
  height: 52px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px) saturate(1.1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  z-index: 500;
  padding: 0 20px;
}
.site-nav .nav-link {
  font-family: var(--font-ui);
  font-size: 14px;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
  position: relative;
  letter-spacing: 0.02em;
}
.site-nav .nav-link:hover { color: var(--accent); }
.site-nav .nav-link::after {
  content: "";
  position: absolute;
  left: 0; bottom: -5px;
  width: 0; height: 1.5px;
  background: var(--accent);
  transition: width 0.25s ease;
}
.site-nav .nav-link:hover::after { width: 100%; }
.site-nav .nav-link.active {
  color: var(--accent);
  font-weight: 600;
}
.site-nav .nav-link.active::after {
  width: 100%;
}
/* Courseware topbar below site nav */
.layout .topbar { top: 52px; }
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="nav-link">主页</a>
  <a href="../../organicchurch/" class="nav-link">文章</a>
  <a href="../index.html" class="nav-link">著作</a>
</nav>
  <div class="layout">
    <header class="topbar">
      <div class="topbar-brand">
        家教会的本体论革命
        <small>Interactive Courseware</small>
      </div>
      <nav class="topbar-nav">
        <a href="index.html">仪表盘</a>
        <a href="chapter.html" class="active">学习</a>
        <a href="review.html">复习</a>
      </nav>
    </header>

    <main class="container">
      <header id="chapter-header" class="chapter-header">
        <p class="kicker">第 X 章</p>
        <h1>章节标题</h1>
      </header>

      <section id="chapter-summary" class="card">
        <div class="empty-state">等待课程数据加载…</div>
      </section>

      <section id="scriptures" class="card"></section>

      <section id="key-terms" class="card"></section>

      <section id="outline" class="card"></section>

      <section id="questions" class="card"></section>

      <button id="mark-done" class="btn-primary mark-done-btn" aria-pressed="false">标记本章完成</button>

      <nav id="prev-next" class="prev-next"></nav>
    </main>
  </div>

  <script src="assets/js/courseware-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/chapter.js"></script>
</body>
</html>
