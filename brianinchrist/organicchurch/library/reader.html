<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF6EC">
<title>在线读书</title>

<!-- Theme pre-apply: must run before CSS paint to avoid theme flash -->
<script>
(function () {
  try {
    var t = localStorage.getItem('reader_theme');
    var m = localStorage.getItem('reader_measure');
    var f = localStorage.getItem('reader_font');
    var d = document.documentElement;
    d.dataset.theme = (t === 'sepia' || t === 'dark' || t === 'olive') ? t : 'light';
    var msr = (m === 'narrow') ? 30 : (m === 'standard') ? 38 : (m === 'wide') ? 48 : parseInt(m, 10);
    if (!(msr >= 26 && msr <= 76)) { msr = 38; }
    d.style.setProperty('--rdr-measure', msr + 'em');
    var size = parseInt(f, 10);
    if (!(size >= 14 && size <= 28)) { size = 18; }
    d.style.setProperty('--rdr-font-size', size + 'px');
  } catch (e) { /* localStorage unavailable: keep defaults */ }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/reader.css?v=3">
</head>
<body>

  <!-- Reading progress: width is set by reader.js -->
  <div id="rdr-progress" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100"></div>

  <!-- Top bar -->
  <header id="rdr-topbar">
    <button id="rdr-menu" type="button" aria-label="目录" aria-expanded="true" aria-controls="rdr-sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <span id="rdr-title" aria-live="polite"></span>

    <nav id="rdr-topnav" aria-label="章节导航">
      <button id="rdr-prev" type="button" aria-label="上一章">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        <span class="rdr-nav-label">上一章</span>
      </button>
      <button id="rdr-next" type="button" aria-label="下一章">
        <span class="rdr-nav-label">下一章</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button id="rdr-courseware" type="button" aria-label="互动课件" aria-expanded="true" hidden>互动课件</button>
      <!-- 我的笔记入口：默认 hidden，reader-annotations.js 就绪后取消（脚本未加载时不出现） -->
      <button id="rdr-notes-btn" type="button" aria-label="我的笔记" aria-expanded="false" aria-controls="rdr-notes-panel" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button id="rdr-settings-btn" type="button" aria-label="阅读设置" aria-expanded="false" aria-controls="rdr-settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>
  </header>

  <!-- Settings popover -->
  <aside id="rdr-settings" aria-label="阅读设置" aria-hidden="true">
    <div class="rdr-setting-row">
      <span class="rdr-setting-label">字号</span>
      <div class="rdr-setting-group">
        <button id="rdr-font-minus" type="button" aria-label="减小字号">A−</button>
        <span id="rdr-font-label">18</span>
        <button id="rdr-font-plus" type="button" aria-label="增大字号">A+</button>
      </div>
    </div>
    <div class="rdr-setting-row">
      <span class="rdr-setting-label">行宽</span>
      <div class="rdr-setting-group">
        <button id="rdr-measure-minus" type="button" aria-label="减小行宽">−</button>
        <span id="rdr-measure-label">38em</span>
        <button id="rdr-measure-plus" type="button" aria-label="增大行宽">+</button>
      </div>
    </div>
    <div class="rdr-setting-row">
      <span class="rdr-setting-label">主题</span>
      <div class="rdr-seg" role="group" aria-label="主题">
        <button type="button" data-theme="light" class="active">浅色</button>
        <button type="button" data-theme="sepia">羊皮</button>
        <button type="button" data-theme="dark">深色</button>
        <button type="button" data-theme="olive">青橄榄</button>
      </div>
    </div>
    <div class="rdr-setting-row" id="rdr-auth-row"></div>
  </aside>

  <!-- Drawer scrim: lives INSIDE #rdr-layout so it shares the drawer's
       stacking context (body-level would cover the drawers entirely). -->
  <div id="rdr-layout">

    <!-- Drawer scrim -->
    <div id="rdr-scrim" hidden></div>

    <!-- Left column: table of contents -->
    <aside id="rdr-sidebar" class="rdr-col rdr-col-left" aria-label="目录">
      <button class="rdr-drawer-close" type="button" aria-label="关闭目录">×</button>
      <div class="rdr-col-header">
        <span class="rdr-col-title">目录</span>
      </div>
      <!-- 目录与讲义在同一个滚动区内：讲义跟着章节目录一起滚，不钉在栏底 -->
      <div id="rdr-toc-scroll" class="rdr-col-body">
        <ul id="rdr-toc"></ul>
        <!-- 讲义 / 附加资源：由 manifest.json 的 extras 字段驱动（缺省则隐藏） -->
        <div id="rdr-toc-extras" class="rdr-extras" hidden></div>
      </div>
      <a id="rdr-toc-bookshelf" href="../bookshelf/index.html">回到书籍总目录</a>
    </aside>

    <!-- Center column: reading pane (this element scrolls, not body) -->
    <main id="rdr-main" class="rdr-col rdr-col-center" tabindex="-1">
      <div id="rdr-content" class="rdr-col-body"></div>

      <button id="rdr-back-top" type="button" aria-label="回到顶部">↑</button>
    </main>

    <div id="rdr-divider-cr" class="rdr-divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="调整正文与课件的分隔" aria-valuenow="360" aria-valuemin="140" aria-valuemax="2400">
      <div class="rdr-divider-grip"></div>
    </div>

    <!-- Right column: interactive courseware -->
    <aside id="rdr-courseware-panel" class="rdr-col rdr-col-right" aria-label="互动课件">
      <button class="rdr-drawer-close" type="button" aria-label="关闭课件">×</button>
      <div class="rdr-col-header">
        <span class="rdr-col-title">互动课件</span>
      </div>
      <div id="rdr-cw-content" class="rdr-col-body"></div>
    </aside>

  </div>

  <script src="assets/js/reader-auth.js?v=1"></script>
  <script src="assets/js/reader-annotations.js?v=4"></script>
  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/reader.js?v=1"></script>
</body>
</html>
