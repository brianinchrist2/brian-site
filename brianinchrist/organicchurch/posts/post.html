<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF6EC">
<title>文章 — 有机教会</title>

<!-- Theme pre-apply: must run before CSS paint to avoid theme flash.
     Shares reader_theme / reader_measure / reader_font with the library
     reader so reading preferences carry across articles and books. -->
<script>
(function () {
  try {
    var t = localStorage.getItem('reader_theme');
    var m = localStorage.getItem('reader_measure');
    var f = localStorage.getItem('reader_font');
    var d = document.documentElement;
    d.dataset.theme = (t === 'sepia' || t === 'dark' || t === 'olive') ? t : 'light';
    var msr = (m === 'narrow') ? 30 : (m === 'standard') ? 38 : (m === 'wide') ? 48 : parseInt(m, 10);
    if (!(msr >= 26 && msr <= 76)) { msr = 38; }
    d.style.setProperty('--rdr-measure', msr + 'em');
    var size = parseInt(f, 10);
    if (!(size >= 14 && size <= 26)) { size = 18; }
    d.style.setProperty('--rdr-font-size', size + 'px');
  } catch (e) { /* localStorage unavailable: keep defaults */ }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/post.css">
</head>
<body>

  <!-- Reading progress: width is set by post-viewer.js -->
  <div id="pt-progress" role="progressbar" aria-label="阅读进度" aria-valuemin="0" aria-valuemax="100"></div>

  <!-- Top bar -->
  <header id="pt-topbar">
    <a id="pt-back" href="../index.html" aria-label="返回文章列表">← 文章</a>
    <span id="pt-top-title" aria-live="polite"></span>
    <button id="pt-settings-btn" type="button" aria-label="阅读设置" aria-expanded="false" aria-controls="pt-settings">Aa</button>
  </header>

  <!-- Settings popover -->
  <aside id="pt-settings" aria-label="阅读设置" aria-hidden="true">
    <div class="pt-setting-row">
      <span class="pt-setting-label">字号</span>
      <div class="pt-setting-group">
        <button id="pt-font-minus" type="button" aria-label="减小字号">A−</button>
        <span id="pt-font-label">18</span>
        <button id="pt-font-plus" type="button" aria-label="增大字号">A+</button>
      </div>
    </div>
    <div class="pt-setting-row">
      <span class="pt-setting-label">行宽</span>
      <div class="pt-setting-group">
        <button id="pt-measure-minus" type="button" aria-label="减小行宽">−</button>
        <span id="pt-measure-label">38em</span>
        <button id="pt-measure-plus" type="button" aria-label="增大行宽">+</button>
      </div>
    </div>
    <div class="pt-setting-row">
      <span class="pt-setting-label">主题</span>
      <div class="pt-seg" role="group" aria-label="主题">
        <button type="button" data-theme="light">浅色</button>
        <button type="button" data-theme="sepia">羊皮</button>
        <button type="button" data-theme="dark">深色</button>
        <button type="button" data-theme="olive">青橄榄</button>
      </div>
    </div>
  </aside>

  <main id="pt-main">
    <article id="pt-article">
      <header class="pt-article-header" id="pt-article-header">
        <div class="pt-eyebrow" id="pt-eyebrow"></div>
        <h1 class="pt-title" id="pt-title"></h1>
        <div class="pt-meta" id="pt-meta"></div>
        <figure class="pt-featured" id="pt-featured" hidden></figure>
      </header>

      <!-- Markdown body injected by post-viewer.js -->
      <div class="pt-body" id="pt-body"></div>

      <!-- Prev / next navigation (date-desc list order) -->
      <nav class="pt-pagenav" id="pt-pagenav" aria-label="上一篇/下一篇" hidden></nav>

      <a href="../index.html" class="pt-back-list">← 返回文章列表</a>
    </article>

    <button id="pt-back-top" type="button" aria-label="回到顶部">↑</button>
  </main>

  <!-- Single vendored marked copy, shared with the library reader -->
  <script src="../library/assets/js/marked.min.js"></script>
  <script src="assets/js/post-viewer.js"></script>
</body>
</html>
