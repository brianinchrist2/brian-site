<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程仪表盘 — 家教会的本体论革命</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/courseware.css">
</head>
<body>
  <div class="layout">
    <header class="topbar">
      <div class="topbar-brand">
        家教会的本体论革命
        <small>Interactive Courseware</small>
      </div>
      <nav class="topbar-nav">
        <a href="index.html" class="active">仪表盘</a>
        <a href="chapter.html">学习</a>
        <a href="review.html">复习</a>
      </nav>
    </header>

    <main class="container">
      <h1 class="visually-hidden">家教会的本体论革命 · 学习课件</h1>

      <a id="resume-btn" class="card resume-card" href="chapter.html" style="display: none;">
        <span class="btn-primary">继续学习</span>
      </a>

      <section class="card" aria-label="学习进度">
        <h2 class="section-title">总进度</h2>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="学习进度"></div>
        </div>
      </section>

      <section id="stats" class="card">
        <h2 class="section-title">学习统计</h2>
        <div class="stats-grid">
          <div class="stat-item"><span id="stat-completed">0/24</span><label>已完成</label></div>
          <div class="stat-item"><span id="stat-visited">0/24</span><label>已浏览</label></div>
          <div class="stat-item"><span id="stat-percent">0%</span><label>总进度</label></div>
          <div class="stat-item"><span id="stat-minutes">0</span><label>学习分钟</label></div>
        </div>
      </section>

      <section class="card" aria-label="导出与打印">
        <h2 class="section-title">导出与打印</h2>
        <div class="export-actions">
          <button id="export-md" type="button" class="btn-secondary">导出 Markdown</button>
          <button id="export-txt" type="button" class="btn-secondary">导出 TXT</button>
          <a href="print.html" class="btn-secondary">打印报告</a>
        </div>
      </section>

      <section class="catalog-section">
        <h2 class="section-title">章节目录</h2>
        <div id="parts-container"></div>
      </section>
    </main>
  </div>

  <script src="assets/js/courseware-data.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/export.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
