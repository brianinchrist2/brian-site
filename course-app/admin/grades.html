<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成绩管理 - 课程学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/vars.css">
<link rel="stylesheet" href="../assets/css/course.css">
<style>
  /* Page-specific: toolbar layout */
  .toolbar-row { display: flex; gap: var(--space-sm); align-items: center; margin: var(--space-md) 0; flex-wrap: wrap; }
  .toolbar-row .form-input { width: auto; max-width: 260px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-brand-mark">Oikos</span>
    <span class="topbar-brand-text">课程管理</span>
  </div>
  <nav class="topbar-nav">
    <a href="../index.html" class="topbar-nav-link">返回前台</a>
  </nav>
</header>
<div class="page-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">管理</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">仪表板</a>
        <a href="attendance.html" class="sidebar-link">考勤管理</a>
        <a href="assignments.html" class="sidebar-link">作业管理</a>
        <a href="submissions.html" class="sidebar-link">批改作业</a>
        <a href="grades.html" class="sidebar-link active">成绩管理</a>
        <a href="assessments.html" class="sidebar-link">考核管理</a>
        <a href="books.html" class="sidebar-link">书籍管理</a>
        <a href="reports.html" class="sidebar-link">评语与证书</a>
        <a href="classes.html" class="sidebar-link">班级管理</a>
      </nav>
    </div>
  </aside>
  <main class="main-content">
    <div class="main-header">
      <div class="main-eyebrow">Gradus</div>
      <h1 class="main-title">成绩管理</h1>
      <p class="main-lede">按课程加载学生成绩，并计算最终成绩。</p>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:var(--space-sm)">
      <button class="btn btn-primary" id="btn-calc">计算成绩</button>
    </div>
    <div class="toolbar-row">
      <input type="text" id="course-id" class="form-input" placeholder="课程ID">
      <button class="btn btn-outline" id="btn-load">加载</button>
    </div>
    <div class="history-table-wrap">
      <table class="history-table">
        <thead><tr><th>学生</th><th>总分</th><th>等级</th><th>状态</th></tr></thead>
        <tbody id="loading-row"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
        <tbody id="grades-table"></tbody>
      </table>
    </div>
    <div id="error-msg" class="error-msg" style="display:none"></div>
  </main>
</div>
<script type="module">
import CourseAuth from '../assets/js/auth.js';
if (!await CourseAuth.requireRole(['teacher', 'admin'])) throw new Error('redirecting');
const token = CourseAuth.getToken();
async function loadGrades() {
  const cid = document.getElementById('course-id').value;
  if (!cid) return;
  document.getElementById('loading-row').style.display = '';
  document.getElementById('error-msg').style.display = 'none';
  try {
    const res = await fetch('/api/modules/grades/final?course_id=' + cid, { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '加载失败'); }
    const data = await res.json();
    var tbody = document.getElementById('grades-table');
    tbody.textContent = '';
    (data.grades || []).forEach(function (g) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td');
      td1.textContent = g.student_name || g.student_id;
      var td2 = document.createElement('td');
      td2.textContent = g.total_score || '?';
      var td3 = document.createElement('td');
      td3.textContent = g.letter_grade || '-';
      var td4 = document.createElement('td');
      td4.textContent = g.status;
      tr.appendChild(td1);
      tr.appendChild(td2);
      tr.appendChild(td3);
      tr.appendChild(td4);
      tbody.appendChild(tr);
    });
  } catch (err) {
    document.getElementById('error-msg').textContent = err.message || '加载失败，请稍后重试';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading-row').style.display = 'none';
  }
}
document.getElementById('btn-load').addEventListener('click', loadGrades);
document.getElementById('btn-calc').addEventListener('click', async function () {
  try {
    const cid = document.getElementById('course-id').value;
    if (!cid) { alert('请输入课程ID'); return; }
    const res = await fetch('/api/modules/grades/calculate?course_id=' + cid, { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
    const data = await res.json();
    if (res.ok) {
      alert('已计算' + data.calculated + '个学生的成绩');
      loadGrades();
    } else {
      alert(data.error || '计算失败');
    }
  } catch (err) {
    alert(err.message || '计算失败，请稍后重试');
  }
});
</script>
</body>
</html>
