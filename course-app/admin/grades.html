<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>成绩管理 - 课程学习</title><link rel="stylesheet" href="../assets/css/vars.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}.topbar a{color:var(--muted);text-decoration:none;font-size:14px}.container{max-width:960px;margin:0 auto;padding:var(--space-lg)}h1{font-size:22px;margin-bottom:var(--space-md)}.btn{padding:8px 16px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:var(--space-md)}th,td{text-align:left;padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border)}</style></head><body><div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div><div class="container"><div style="display:flex;justify-content:space-between;align-items:center"><h1>成绩管理</h1><button class="btn" id="btn-calc">计算成绩</button></div><div style="margin:var(--space-md) 0"><input type="text" id="course-id" placeholder="课程ID" style="padding:8px;border:1px solid var(--border);border-radius:4px"><button class="btn" id="btn-load">加载</button></div><table><thead><tr><th>学生</th><th>总分</th><th>等级</th><th>状态</th></tr></thead><tbody id="grades-table"></tbody></table></div><script type="module">import CourseAuth from '../assets/js/auth.js';if(!CourseAuth.requireAuth())throw new Error('redirecting');const token=CourseAuth.getToken();async function loadGrades(){const cid=document.getElementById('course-id').value;if(!cid)return;const res=await fetch('/api/modules/grades/final?course_id='+cid,{headers:{Authorization:'Bearer '+token}});const data=await res.json();var tbody=document.getElementById('grades-table');tbody.textContent='';(data.grades||[]).forEach(function(g){var tr=document.createElement('tr');var td1=document.createElement('td');td1.textContent=g.student_name||g.student_id;var td2=document.createElement('td');td2.textContent=g.total_score||'?';var td3=document.createElement('td');td3.textContent=g.letter_grade||'-';var td4=document.createElement('td');td4.textContent=g.status;tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);tbody.appendChild(tr);});}document.getElementById('btn-load').addEventListener('click',loadGrades);document.getElementById('btn-calc').addEventListener('click',async function(){const cid=document.getElementById('course-id').value;if(!cid){alert('请输入课程ID');return;}const res=await fetch('/api/modules/grades/calculate?course_id='+cid,{method:'POST',headers:{Authorization:'Bearer '+token}});const data=await res.json();if(res.ok){alert('已计算'+data.calculated+'个学生的成绩');loadGrades();}else{alert(data.error||'计算失败');}});</script></body></html>
