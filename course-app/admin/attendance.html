<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考勤管理 — 有机教会课程系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/vars.css">
  <link rel="stylesheet" href="../assets/css/course.css">
  <style>
    /* ============================================================
       Page-specific styles (admin/attendance)
       Classes below are rendered by assets/js/attendance.js — kept local.
       ============================================================ */
    :root {
      --late-ink: #A66A00; /* C1: late/rate-mid ink — ≥4.5:1 on parchment */
    }

    /* Controls */
    .controls-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .control-row { display: flex; gap: var(--space-md); align-items: flex-end; flex-wrap: wrap; }
    .control-group { display: flex; flex-direction: column; gap: var(--space-xs); flex: 1; min-width: 200px; }
    .control-label { font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500; color: var(--muted); }
    .control-select {
      padding: var(--space-sm);
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      font-family: var(--font-ui);
      font-size: 0.95rem;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .control-select:focus { outline: none; border-color: var(--accent); }

    /* Sections */
    .roster-section, .stats-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); gap: var(--space-sm); flex-wrap: wrap; }
    .section-title { font-family: var(--font-body); font-size: 1.25rem; font-weight: 600; color: var(--text); }

    /* Roster table (classes kept local; wrapped in shared .history-table-wrap) */
    .roster-table { width: 100%; border-collapse: collapse; background: var(--bg); }
    .roster-table th { padding: var(--space-sm); text-align: left; font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600; color: var(--muted); border-bottom: 2px solid var(--border); }
    .roster-table td { padding: var(--space-sm); border-bottom: 1px solid var(--border); font-family: var(--font-ui); font-size: 0.95rem; color: var(--text); }
    .roster-table tr:last-child td { border-bottom: none; }
    .student-name { font-weight: 500; color: var(--text); }
    .status-buttons { display: flex; gap: var(--space-xs); }
    .status-btn {
      padding: 6px 12px;
      border: 2px solid var(--status-color, var(--border));
      border-radius: 4px;
      background: transparent;
      color: var(--status-color, var(--muted));
      font-family: var(--font-ui);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .status-btn:hover { background: color-mix(in srgb, var(--status-color) 10%, transparent); }
    .status-btn.active { background: var(--status-color); color: var(--bg); }
    .status-btn[data-status="late"] { color: var(--late-ink); border-color: var(--late-ink); }
    .status-btn[data-status="late"].active { background: var(--late-ink); }
    .notes-input {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      font-family: var(--font-ui);
      font-size: 0.9rem;
      color: var(--text);
      box-sizing: border-box;
    }
    .notes-input:focus { outline: none; border-color: var(--accent); }
    .empty-state { text-align: center; padding: var(--space-lg); color: var(--muted); font-style: italic; }

    /* Stats */
    .stats-summary { display: flex; gap: var(--space-md); margin-bottom: var(--space-md); flex-wrap: wrap; }
    .stat-card {
      flex: 1;
      min-width: 150px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: var(--space-md);
      text-align: center;
    }
    .stat-value { display: block; font-family: var(--font-latin); font-size: 2rem; font-weight: 600; color: var(--accent); margin-bottom: var(--space-xs); }
    .stat-label { display: block; font-family: var(--font-ui); font-size: 0.85rem; color: var(--muted); }
    .stats-table { width: 100%; border-collapse: collapse; background: var(--bg); }
    .stats-table th { padding: var(--space-sm); text-align: left; font-family: var(--font-ui); font-size: 0.85rem; font-weight: 600; color: var(--muted); background: var(--surface-2); border-bottom: 2px solid var(--border); }
    .stats-table td { padding: var(--space-sm); border-bottom: 1px solid var(--border); font-family: var(--font-ui); font-size: 0.9rem; color: var(--text); }
    .stats-table tr:last-child td { border-bottom: none; }

    /* Status inks (H4: token-based, ≥4.5:1) */
    .present-count { color: var(--status-present); font-weight: 500; }
    .absent-count { color: var(--status-absent); font-weight: 500; }
    .late-count { color: var(--late-ink); font-weight: 500; }
    .excused-count { color: var(--status-excused); font-weight: 500; }
    .rate-high { color: var(--status-present); font-weight: 600; }
    .rate-mid { color: var(--late-ink); font-weight: 600; }
    .rate-low { color: var(--status-absent); font-weight: 600; }

    /* ============================================================
       Responsive (page-specific)
       ============================================================ */
    @media (max-width: 768px) {
      .control-row { flex-direction: column; align-items: stretch; }
      .control-group { min-width: 100%; }
      .status-buttons { flex-wrap: wrap; }
      .stats-summary { flex-direction: column; }
      .stat-card { min-width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-brand-mark">Oikos</span>
      <span class="topbar-brand-text">课程管理</span>
    </div>
    <nav class="topbar-nav">
      <a href="../index.html" class="topbar-nav-link">返回前台</a>
    </nav>
  </header>

  <div class="page-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">管理</div>
        <nav class="sidebar-nav">
          <a href="dashboard.html" class="sidebar-link">仪表板</a>
          <a href="attendance.html" class="sidebar-link active">考勤管理</a>
          <a href="assignments.html" class="sidebar-link">作业管理</a>
          <a href="submissions.html" class="sidebar-link">批改作业</a>
          <a href="grades.html" class="sidebar-link">成绩管理</a>
          <a href="assessments.html" class="sidebar-link">考核管理</a>
          <a href="books.html" class="sidebar-link">书籍管理</a>
          <a href="reports.html" class="sidebar-link">评语与证书</a>
          <a href="classes.html" class="sidebar-link">班级管理</a>
        </nav>
      </div>
    </aside>

    <main class="main-content">
      <div class="main-header">
        <div class="main-eyebrow">Attendere</div>
        <h1 class="main-title">考勤管理</h1>
        <p class="main-lede">记录和管理学生出勤情况。</p>
      </div>

      <!-- Controls -->
      <section class="controls-section">
        <div class="control-row">
          <div class="control-group">
            <label class="control-label" for="class-select">选择班级</label>
            <select id="class-select" class="control-select">
              <option value="">-- 选择班级 --</option>
            </select>
          </div>
          <div class="control-group">
            <label class="control-label" for="session-select">选择课堂</label>
            <select id="session-select" class="control-select">
              <option value="">-- 选择课堂 --</option>
            </select>
          </div>
          <div class="control-group" style="flex: 0;">
            <label class="control-label">&nbsp;</label>
            <button id="create-session-btn" class="btn btn-primary">+ 新建课堂</button>
          </div>
        </div>
      </section>

      <!-- Roster -->
      <section class="roster-section">
        <div class="section-header">
          <h2 class="section-title">学生名单</h2>
          <div style="display:flex;gap:var(--space-xs);flex-wrap:wrap">
            <button id="mark-all-present-btn" class="btn btn-outline">全部标记出席</button>
            <button id="save-attendance-btn" class="btn btn-secondary">保存考勤</button>
          </div>
        </div>
        <div class="history-table-wrap">
          <table class="roster-table">
            <thead>
              <tr>
                <th>学生姓名</th>
                <th>出勤状态</th>
                <th>备注</th>
              </tr>
            </thead>
            <tbody id="roster-tbody">
              <tr>
                <td colspan="3" class="empty-state">请先选择班级</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Stats -->
      <section class="stats-section">
        <div class="section-header">
          <h2 class="section-title">出勤统计</h2>
          <button id="refresh-stats-btn" class="btn btn-outline">刷新统计</button>
        </div>
        <div id="stats-container">
          <p class="empty-state">请选择班级查看统计数据</p>
        </div>
      </section>
    </main>
  </div>

  <!-- Create Session Modal -->
  <div id="create-session-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">新建课堂</h3>
        <button id="close-modal-btn" class="modal-close">&times;</button>
      </div>
      <form id="create-session-form">
        <div class="form-group">
          <label class="form-label" for="session-title">课堂名称 *</label>
          <input type="text" id="session-title" class="form-input" required placeholder="例：第一课 教会的根基">
        </div>
        <div class="form-group">
          <label class="form-label" for="session-date">日期 *</label>
          <input type="date" id="session-date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="session-start">开始时间</label>
          <input type="time" id="session-start" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="session-end">结束时间</label>
          <input type="time" id="session-end" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="session-course">课程编号（可选）</label>
          <input type="text" id="session-course" class="form-input" placeholder="例：COURSE-001">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-outline" id="close-modal-btn-2">取消</button>
          <button type="submit" class="btn btn-primary">创建课堂</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import CourseAuth from '../assets/js/auth.js';
    if (!await CourseAuth.requireRole(['teacher','admin'])) throw new Error('redirecting');
  </script>
  <script src="../assets/js/attendance.js"></script>
  <script>
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.open').forEach(function (m) { m.classList.remove('open'); });
      }
    });
  </script>
</body>
</html>
