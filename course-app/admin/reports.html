<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>评语与证书审批 - 课程学习</title><link rel="stylesheet" href="../assets/css/vars.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}.topbar a{color:var(--muted);text-decoration:none;font-size:14px}.container{max-width:800px;margin:0 auto;padding:var(--space-lg)}h1{font-size:22px;margin-bottom:var(--space-md)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border)}.btn{padding:6px 12px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:13px}</style></head><body><div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div><div class="container"><h1>评语与证书审批</h1><table><thead><tr><th>学生</th><th>课程</th><th>证书状态</th><th>操作</th></tr></thead><tbody id="cert-list"></tbody></table></div><script type="module">import CourseAuth from '../assets/js/auth.js';if(!CourseAuth.requireAuth())throw new Error('redirecting');const token=CourseAuth.getToken();async function loadCerts(){const res=await fetch('/api/modules/certificates',{headers:{Authorization:'Bearer '+token}});const data=await res.json();document.getElementById('cert-list').innerHTML=(data.certificates||[]).map(function(c){return '<tr><td>'+c.student_id+'</td><td>'+c.course_id+'</td><td>'+c.status+'</td><td>'+(c.status==='pending'?'<button class="btn" data-id="'+c.id+'" data-action="approve">批准</button> <button class="btn" data-id="'+c.id+'" data-action="reject">拒绝</button>':'-')+'</td></tr>';}).join('');}loadCerts();</script></body></html>
