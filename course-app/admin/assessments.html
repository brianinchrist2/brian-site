<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考核管理 - 课程学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/vars.css">
<link rel="stylesheet" href="../assets/css/course.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-brand-mark">Oikos</span>
    <span class="topbar-brand-text">课程管理</span>
  </div>
  <nav class="topbar-nav">
    <a href="../index.html" class="topbar-nav-link">返回前台</a>
  </nav>
</header>
<div class="page-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">管理</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">仪表板</a>
        <a href="attendance.html" class="sidebar-link">考勤管理</a>
        <a href="assignments.html" class="sidebar-link">作业管理</a>
        <a href="submissions.html" class="sidebar-link">批改作业</a>
        <a href="grades.html" class="sidebar-link">成绩管理</a>
        <a href="assessments.html" class="sidebar-link active">考核管理</a>
        <a href="books.html" class="sidebar-link">书籍管理</a>
        <a href="reports.html" class="sidebar-link">评语与证书</a>
        <a href="classes.html" class="sidebar-link">班级管理</a>
      </nav>
    </div>
  </aside>
  <main class="main-content">
    <div class="main-header">
      <div class="main-eyebrow">Examen</div>
      <h1 class="main-title">考核管理</h1>
      <p class="main-lede">创建测验与考试，设置满分和时限。</p>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:var(--space-md)">
      <button class="btn btn-primary" id="btn-add">创建考核</button>
    </div>
    <div class="history-table-wrap">
      <table class="history-table">
        <thead><tr><th>标题</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="loading-row"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
        <tbody id="exam-list"></tbody>
      </table>
    </div>
    <div id="error-msg" class="error-msg" style="display:none"></div>
  </main>
</div>
<div class="modal-overlay" id="modal-add">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">创建考核</h2>
      <button type="button" class="modal-close">&times;</button>
    </div>
    <div class="form-group"><label>课程ID</label><input type="text" id="e-course" class="form-input"></div>
    <div class="form-group"><label>标题</label><input type="text" id="e-title" class="form-input"></div>
    <div class="form-group"><label>类型</label><select id="e-type" class="form-input"><option value="quiz">测验</option><option value="exam">考试</option></select></div>
    <div class="form-group"><label>满分</label><input type="number" id="e-total" class="form-input" value="100"></div>
    <div class="form-group"><label>时限(分钟)</label><input type="number" id="e-duration" class="form-input"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" id="btn-cancel">取消</button>
      <button class="btn btn-primary" id="btn-save">保存</button>
    </div>
  </div>
</div>
<script type="module">
import CourseAuth from '../assets/js/auth.js';
if (!await CourseAuth.requireRole(['teacher', 'admin'])) throw new Error('redirecting');
const token = CourseAuth.getToken();
const modal = document.getElementById('modal-add');
async function loadExams() {
  document.getElementById('loading-row').style.display = '';
  document.getElementById('error-msg').style.display = 'none';
  try {
    const res = await fetch('/api/modules/assessments', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '加载失败'); }
    const data = await res.json();
    var list = document.getElementById('exam-list');
    list.innerHTML = '';
    var fragment = document.createDocumentFragment();
    (data.assessments || []).forEach(function (a) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td');
      td1.textContent = a.title;
      tr.appendChild(td1);
      var td2 = document.createElement('td');
      td2.textContent = a.type;
      tr.appendChild(td2);
      var td3 = document.createElement('td');
      td3.textContent = a.status;
      tr.appendChild(td3);
      var td4 = document.createElement('td');
      var aLink = document.createElement('a');
      aLink.href = '#';
      aLink.dataset.id = a.id;
      aLink.className = 'btn-view';
      aLink.textContent = '\u7BA1\u7406\u9898\u76EE';
      td4.appendChild(aLink);
      tr.appendChild(td4);
      fragment.appendChild(tr);
    });
    list.appendChild(fragment);
  } catch (err) {
    document.getElementById('error-msg').textContent = err.message || '加载失败，请稍后重试';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading-row').style.display = 'none';
  }
}
document.getElementById('btn-add').addEventListener('click', function () { modal.classList.add('open'); });
document.getElementById('btn-cancel').addEventListener('click', function () { modal.classList.remove('open'); });
document.getElementById('btn-save').addEventListener('click', async function () {
  try {
    var res = await fetch('/api/modules/assessments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({
        course_id: document.getElementById('e-course').value,
        title: document.getElementById('e-title').value,
        type: document.getElementById('e-type').value,
        total_score: parseFloat(document.getElementById('e-total').value),
        duration_minutes: parseInt(document.getElementById('e-duration').value) || null
      })
    });
    if (res.ok) { modal.classList.remove('open'); loadExams(); }
  } catch (err) {
    alert(err.message || '保存失败，请稍后重试');
  }
});
loadExams();
</script>
<script>
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.open').forEach(function (m) { m.classList.remove('open'); });
    }
  });
  document.querySelectorAll('.modal-overlay').forEach(function (m) {
    m.addEventListener('click', function (e) { if (e.target === m) m.classList.remove('open'); });
    m.querySelectorAll('.modal-close').forEach(function (b) {
      b.addEventListener('click', function () { m.classList.remove('open'); });
    });
  });
</script>
</body>
</html>
