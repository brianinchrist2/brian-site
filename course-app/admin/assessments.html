<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考核管理 - 课程学习</title>
<link rel="stylesheet" href="../assets/css/vars.css">
<style>
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}
.topbar a{color:var(--muted);text-decoration:none;font-size:14px}
.container{max-width:960px;margin:0 auto;padding:var(--space-lg)}
h1{font-size:22px;margin-bottom:var(--space-md)}
.btn{padding:8px 16px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:var(--space-md)}
th,td{text-align:left;padding:var(--space-sm) var(--space-md);border-bottom:1px solid var(--border)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-content{background:var(--surface);padding:var(--space-xl);border-radius:8px;width:100%;max-width:500px}
.form-group{margin-bottom:var(--space-md)}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;box-sizing:border-box}
.loading{color:var(--muted);font-size:14px}
.error-msg{color:#c62828;background:#ffebee;padding:var(--space-sm);border-radius:4px;font-size:14px}
@media(max-width:768px){.topbar{flex-direction:column;gap:var(--space-sm);align-items:flex-start}.container{padding:var(--space-md)}table{font-size:14px}th,td{padding:var(--space-xs) var(--space-sm)}.modal-content{margin:var(--space-md);padding:var(--space-lg)}}
</style>
</head>
<body>
<div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div>
<div class="container">
<div style="display:flex;justify-content:space-between;align-items:center">
<h1>考核管理</h1><button class="btn" id="btn-add">创建考核</button>
</div>
<table><thead><tr><th>标题</th><th>类型</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="loading-row"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody>
<tbody id="exam-list"></tbody></table>
<div id="error-msg" class="error-msg" style="display:none"></div>
</div>
<div class="modal" id="modal-add"><div class="modal-content">
<h2>创建考核</h2>
<div class="form-group"><label>课程ID</label><input type="text" id="e-course"></div>
<div class="form-group"><label>标题</label><input type="text" id="e-title"></div>
<div class="form-group"><label>类型</label><select id="e-type"><option value="quiz">测验</option><option value="exam">考试</option></select></div>
<div class="form-group"><label>满分</label><input type="number" id="e-total" value="100"></div>
<div class="form-group"><label>时限(分钟)</label><input type="number" id="e-duration"></div>
<div style="display:flex;gap:8px;justify-content:flex-end">
<button class="btn" id="btn-cancel" style="background:var(--muted)">取消</button>
<button class="btn" id="btn-save">保存</button>
</div></div></div>
<script type="module">
import CourseAuth from '../assets/js/auth.js';
if (!await CourseAuth.requireRole(['teacher','admin'])) throw new Error('redirecting');
const token = CourseAuth.getToken();
const modal = document.getElementById('modal-add');
async function loadExams() {
  document.getElementById('loading-row').style.display = '';
  document.getElementById('error-msg').style.display = 'none';
  try {
  const res = await fetch('/api/modules/assessments', { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '加载失败'); }
  const data = await res.json();
  var list = document.getElementById('exam-list');
  list.innerHTML = '';
  var fragment = document.createDocumentFragment();
  (data.assessments||[]).forEach(function(a) {
    var tr = document.createElement('tr');
    var td1 = document.createElement('td');
    td1.textContent = a.title;
    tr.appendChild(td1);
    var td2 = document.createElement('td');
    td2.textContent = a.type;
    tr.appendChild(td2);
    var td3 = document.createElement('td');
    td3.textContent = a.status;
    tr.appendChild(td3);
    var td4 = document.createElement('td');
    var aLink = document.createElement('a');
    aLink.href = '#';
    aLink.dataset.id = a.id;
    aLink.textContent = '\u7BA1\u7406\u9898\u76EE';
    td4.appendChild(aLink);
    tr.appendChild(td4);
    fragment.appendChild(tr);
  });
  list.appendChild(fragment);
  } catch(err) {
    document.getElementById('error-msg').textContent = err.message || '加载失败，请稍后重试';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading-row').style.display = 'none';
  }
}
document.getElementById('btn-add').addEventListener('click', function() { modal.classList.add('active'); });
document.getElementById('btn-cancel').addEventListener('click', function() { modal.classList.remove('active'); });
document.getElementById('btn-save').addEventListener('click', async function() {
  try {
  var res = await fetch('/api/modules/assessments', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ course_id: document.getElementById('e-course').value, title: document.getElementById('e-title').value, type: document.getElementById('e-type').value, total_score: parseFloat(document.getElementById('e-total').value), duration_minutes: parseInt(document.getElementById('e-duration').value) || null })
  });
  if (res.ok) { modal.classList.remove('active'); loadExams(); }
  } catch(err) {
    alert(err.message || '保存失败，请稍后重试');
  }
});
loadExams();
</script>
</body>
</html>
