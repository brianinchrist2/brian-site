<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>学生仪表盘 - 课程学习</title><link rel="stylesheet" href="../assets/css/vars.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}.topbar a{color:var(--muted);text-decoration:none;font-size:14px}.container{max-width:900px;margin:0 auto;padding:var(--space-lg)}h1{font-size:22px;margin-bottom:var(--space-md)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--space-md)}.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:var(--space-md);text-decoration:none;color:var(--text)}.card:hover{border-color:var(--accent)}.card h3{margin:0 0 var(--space-xs);font-size:16px;color:var(--accent)}.card p{margin:0;font-size:13px;color:var(--muted)}</style></head><body><div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div><div class="container"><h1>学生仪表盘</h1><div id="user-info" style="margin-bottom:var(--space-md)"></div><div class="grid"><a href="attendance.html" class="card"><h3>考勤</h3><p>查看考勤记录</p></a><a href="assignments.html" class="card"><h3>作业</h3><p>查看和提交作业</p></a><a href="assessments.html" class="card"><h3>考核</h3><p>参加考试</p></a><a href="videos.html" class="card"><h3>视频</h3><p>观看视频课程</p></a><a href="grades.html" class="card"><h3>成绩</h3><p>查看成绩</p></a><a href="questions.html" class="card"><h3>问答</h3><p>提问讨论</p></a><a href="certificate.html" class="card"><h3>证书</h3><p>申请结业证书</p></a></div></div><script type="module">import CourseAuth from '../assets/js/auth.js';if(!CourseAuth.requireAuth())throw new Error('redirecting');const profile=awa
