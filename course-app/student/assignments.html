<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的作业 - 课程学习</title>
<link rel="stylesheet" href="../assets/css/vars.css">
<style>
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);flex-wrap:wrap;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}
.topbar .home-link{color:var(--muted);text-decoration:none;font-size:14px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav a{color:var(--muted);text-decoration:none;font-size:13px;padding:5px 12px;border-radius:999px}
.topnav a:hover{background:var(--bg);color:var(--text)}
.topnav a.active{color:var(--accent);font-weight:600;background:var(--mark)}
.container{max-width:800px;margin:0 auto;padding:var(--space-lg)}
h1{font-size:22px;margin-bottom:var(--space-md)}
.group-title{font-size:16px;font-weight:600;margin:var(--space-md) 0 var(--space-sm);color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:var(--space-md);margin-bottom:var(--space-sm)}
.card h3{margin:0 0 var(--space-xs);font-size:16px}
.card .meta{font-size:13px;color:var(--muted)}
.card .status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px}
.status-submitted{background:#e8f5e9;color:#2e7d32}
.status-graded{background:#e3f2fd;color:#1565c0}
.status-late{background:#fff3e0;color:#e65100}
textarea{width:100%;min-height:100px;padding:8px;border:1px solid var(--border);border-radius:4px;box-sizing:border-box;font-family:inherit}
.btn{padding:8px 16px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:14px}
.btn:hover{opacity:.9}
.grade-box{margin-top:var(--space-sm);padding:var(--space-sm);background:var(--bg);border-radius:4px}
.loading{color:var(--muted);font-size:14px}
.error-msg{color:#c62828;background:#ffebee;padding:var(--space-sm);border-radius:4px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:var(--space-lg) 0;text-align:center}
</style>
</head>
<body>
<div class="topbar">
<a href="../index.html" class="brand">Scriptorium</a>
<nav class="topnav">
<a href="dashboard.html">仪表盘</a>
<a href="courses.html">我的课程</a>
<a href="assignments.html" class="active">作业</a>
<a href="assessments.html">考核</a>
<a href="grades.html">成绩</a>
<a href="certificate.html">证书</a>
</nav>
<a href="../index.html" class="home-link">返回首页</a>
</div>
<div class="container">
<h1>我的作业</h1>
<div id="loading" class="loading">加载中...</div>
<div id="error-msg" class="error-msg" style="display:none"></div>
<div id="assignments-list"></div>
</div>
<script type="module">
import CourseAuth from '../assets/js/auth.js';
if (!CourseAuth.requireAuth()) throw new Error('redirecting');
const token = CourseAuth.getToken();
const courseIdParam = new URLSearchParams(window.location.search).get('course_id');
async function loadAssignments() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
  try {
  const url = courseIdParam ? '/api/modules/assignments?course_id=' + encodeURIComponent(courseIdParam) : '/api/modules/assignments';
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '加载失败'); }
  const data = await res.json();
  const list = document.getElementById('assignments-list');
  if (!data.assignments || data.assignments.length === 0) { list.innerHTML = '<p class="empty">暂无作业</p>'; return; }
  list.innerHTML = '';
  var byCourse = {};
  data.assignments.forEach(function(a) {
    var key = a.course_title || '\u672A\u5206\u7EC4';
    if (!byCourse[key]) byCourse[key] = [];
    byCourse[key].push(a);
  });
  var fragment = document.createDocumentFragment();
  Object.keys(byCourse).forEach(function(courseTitle) {
    var h2 = document.createElement('h2');
    h2.className = 'group-title';
    h2.textContent = courseTitle;
    fragment.appendChild(h2);
    byCourse[courseTitle].forEach(function(a) {
    var card = document.createElement('div');
    card.className = 'card';
    var h3 = document.createElement('h3');
    h3.textContent = a.title;
    card.appendChild(h3);
    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = '\u7C7B\u578B: ' + a.type + ' | \u622A\u6B62: ' + (a.due_date || '\u65E0') + ' | \u6EE1\u5206: ' + a.max_score;
    card.appendChild(meta);
    var statusDiv = document.createElement('div');
    statusDiv.id = 'status-' + a.id;
    statusDiv.style.cssText = 'margin-top:var(--space-xs)';
    card.appendChild(statusDiv);
    var submitArea = document.createElement('div');
    submitArea.id = 'submit-area-' + a.id;
    submitArea.style.cssText = 'margin-top:var(--space-sm)';
    var textarea = document.createElement('textarea');
    textarea.id = 'content-' + a.id;
    textarea.placeholder = '\u8F93\u5165\u4F5C\u4E1A\u5185\u5BB9...';
    submitArea.appendChild(textarea);
    var btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '\u63D0\u4EA4';
    btn.addEventListener('click', function() { submitAssignment(a.id, a.due_date); });
    submitArea.appendChild(btn);
    var errEl = document.createElement('div');
    errEl.id = 'submit-error-' + a.id;
    errEl.className = 'error-msg';
    errEl.style.display = 'none';
    errEl.style.marginTop = 'var(--space-xs)';
    submitArea.appendChild(errEl);
    card.appendChild(submitArea);
    fragment.appendChild(card);
    });
  });
  list.appendChild(fragment);
  } catch(err) {
    document.getElementById('error-msg').textContent = err.message || '加载失败，请稍后重试';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}
window.submitAssignment = async (id, dueDate) => {
  const btn = document.querySelector(`#submit-area-${id} .btn`);
  const textarea = document.getElementById(`content-${id}`);
  const errEl = document.getElementById(`submit-error-${id}`);
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = '\u63D0\u4EA4\u4E2D\u2026';
  try {
    const res = await fetch(`/api/modules/assignments/${id}/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body: JSON.stringify({ content: textarea.value })
    });
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      errEl.textContent = errData.error || '\u63D0\u4EA4\u5931\u8D25\uFF0C\u8BF7\u7A0D\u540E\u91CD\u8BD5';
      errEl.style.display = 'block';
      return;
    }
    const late = !!(dueDate && new Date() > new Date(dueDate));
    const statusDiv = document.getElementById(`status-${id}`);
    statusDiv.textContent = '';
    const badge = document.createElement('span');
    badge.className = late ? 'status-late' : 'status-submitted';
    badge.textContent = late ? '\u8FDF\u4EA4\u5DF2\u63D0\u4EA4' : '\u5DF2\u63D0\u4EA4';
    statusDiv.appendChild(badge);
  } catch (err) {
    errEl.textContent = err.message || '\u63D0\u4EA4\u5931\u8D25\uFF0C\u8BF7\u7A0D\u540E\u91CD\u8BD5';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = '\u63D0\u4EA4';
  }
};
loadAssignments();
</script>
</body>
</html>
