<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的课程 - 课程学习</title>
<link rel="stylesheet" href="../assets/css/vars.css">
<style>
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);flex-wrap:wrap;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}
.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}
.topbar .home-link{color:var(--muted);text-decoration:none;font-size:14px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav a{color:var(--muted);text-decoration:none;font-size:13px;padding:5px 12px;border-radius:999px}
.topnav a:hover{background:var(--bg);color:var(--text)}
.topnav a.active{color:var(--accent);font-weight:600;background:var(--mark)}
.container{max-width:900px;margin:0 auto;padding:var(--space-lg)}
h1{font-size:22px;margin-bottom:var(--space-md)}
.course-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:var(--space-md);margin-bottom:var(--space-sm)}
.course-card h3{margin:0 0 var(--space-xs);font-size:16px;color:var(--accent)}
.course-card .desc{font-size:13px;color:var(--muted);margin:0 0 var(--space-sm)}
.progress-row{display:flex;align-items:center;gap:var(--space-sm);margin-bottom:var(--space-sm)}
.progress-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent2);border-radius:3px}
.progress-text{font-size:12px;color:var(--muted);white-space:nowrap}
.btn{padding:6px 16px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn:hover{opacity:.9}
.back-link{display:inline-block;margin-bottom:var(--space-md);font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer}
.back-link:hover{color:var(--accent)}
.group-title{font-size:16px;font-weight:600;margin:var(--space-md) 0 var(--space-sm);color:var(--text)}
.item-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:var(--space-sm) var(--space-md);margin-bottom:var(--space-xs)}
.item-row .item-title{font-size:14px;color:var(--text)}
.item-row a{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.item-row a:hover{text-decoration:underline}
.loading{color:var(--muted);font-size:14px}
.error-msg{color:#c62828;background:#ffebee;padding:var(--space-sm);border-radius:4px;font-size:14px}
.empty{color:var(--muted);font-size:14px;padding:var(--space-lg) 0;text-align:center}
</style>
</head>
<body>
<div class="topbar">
<a href="../index.html" class="brand">Scriptorium</a>
<nav class="topnav">
<a href="dashboard.html">仪表盘</a>
<a href="courses.html" class="active">我的课程</a>
<a href="assignments.html">作业</a>
<a href="assessments.html">考核</a>
<a href="grades.html">成绩</a>
<a href="certificate.html">证书</a>
</nav>
<a href="../index.html" class="home-link">返回首页</a>
</div>
<div class="container">
<div id="list-section">
<h1>我的课程</h1>
<div id="loading" class="loading">加载中...</div>
<div id="error-msg" class="error-msg" style="display:none"></div>
<div id="course-list"></div>
</div>
<div id="detail-section" style="display:none">
<a id="back-link" class="back-link">&larr; 返回我的课程</a>
<h1 id="detail-title"></h1>
<p id="detail-desc" class="desc"></p>
<div id="detail-groups"></div>
</div>
</div>
<script type="module">
import CourseAuth from '../assets/js/auth.js';
if (!CourseAuth.requireAuth()) throw new Error('redirecting');
const token = CourseAuth.getToken();

const TYPE_GROUPS = {
  video: { label: '\u89C6\u9891', page: 'videos.html' },
  assignment: { label: '\u4F5C\u4E1A', page: 'assignments.html' },
  assessment: { label: '\u8003\u6838', page: 'assessments.html' },
  quiz: { label: '\u8003\u6838', page: 'assessments.html' },
  other: { label: '\u5176\u4ED6\u5185\u5BB9', page: null }
};
const GROUP_ORDER = ['video', 'assignment', 'assessment', 'other'];
let currentCourse = null;

function groupKey(type) {
  return TYPE_GROUPS[type] ? type : 'other';
}

async function loadCourses() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
  try {
    const res = await fetch('/api/modules/courses/enrolled', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '\u52A0\u8F7D\u5931\u8D25'); }
    const data = await res.json();
    renderCourses(data.courses || []);
  } catch (err) {
    document.getElementById('error-msg').textContent = err.message || '\u52A0\u8F7D\u5931\u8D25\uFF0C\u8BF7\u7A0D\u540E\u91CD\u8BD5';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

function renderCourses(courses) {
  const list = document.getElementById('course-list');
  list.innerHTML = '';
  if (courses.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = '\u5C1A\u672A\u9009\u62E9\u8BFE\u7A0B\uFF0C\u8BF7\u8054\u7CFB\u7BA1\u7406\u5458\u5C06\u4F60\u52A0\u5165\u8BFE\u7A0B';
    list.appendChild(empty);
    return;
  }
  const fragment = document.createDocumentFragment();
  courses.forEach(function (course) {
    const card = document.createElement('div');
    card.className = 'course-card';
    const h3 = document.createElement('h3');
    h3.textContent = course.title;
    card.appendChild(h3);
    const desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = course.description || '\u6682\u65E0\u63CF\u8FF0';
    card.appendChild(desc);
    const total = Number(course.total_items) || 0;
    const done = Number(course.completed_items) || 0;
    const pct = total > 0 ? Math.min(100, Math.round(done / total * 100)) : 0;
    const progressRow = document.createElement('div');
    progressRow.className = 'progress-row';
    const track = document.createElement('div');
    track.className = 'progress-track';
    const fill = document.createElement('div');
    fill.className = 'progress-fill';
    fill.style.width = pct + '%';
    track.appendChild(fill);
    progressRow.appendChild(track);
    const text = document.createElement('span');
    text.className = 'progress-text';
    text.textContent = '\u8FDB\u5EA6 ' + done + ' / ' + total + ' (' + pct + '%)';
    progressRow.appendChild(text);
    card.appendChild(progressRow);
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '\u8FDB\u5165\u8BFE\u7A0B';
    btn.addEventListener('click', function () { openCourse(course); });
    card.appendChild(btn);
    fragment.appendChild(card);
  });
  list.appendChild(fragment);
}

function openCourse(course) {
  currentCourse = course;
  document.getElementById('list-section').style.display = 'none';
  document.getElementById('detail-section').style.display = 'block';
  document.getElementById('detail-title').textContent = course.title;
  document.getElementById('detail-desc').textContent = course.description || '';
  document.getElementById('detail-groups').innerHTML = '';
  loadItems(course.id);
}

async function loadItems(courseId) {
  const groups = document.getElementById('detail-groups');
  const loading = document.createElement('p');
  loading.className = 'loading';
  loading.textContent = '\u52A0\u8F7D\u8BFE\u7A0B\u5185\u5BB9...';
  groups.appendChild(loading);
  try {
    const res = await fetch('/api/modules/courses/items?course_id=' + encodeURIComponent(courseId), { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '\u52A0\u8F7D\u5931\u8D25'); }
    const data = await res.json();
    groups.innerHTML = '';
    renderItems(data.items || []);
  } catch (err) {
    groups.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'error-msg';
    p.textContent = err.message || '\u52A0\u8F7D\u5931\u8D25\uFF0C\u8BF7\u7A0D\u540E\u91CD\u8BD5';
    groups.appendChild(p);
  }
}

function renderItems(items) {
  const groups = document.getElementById('detail-groups');
  if (items.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.textContent = '\u8BE5\u8BFE\u7A0B\u5C1A\u65E0\u5185\u5BB9';
    groups.appendChild(empty);
    return;
  }
  const byGroup = {};
  items.forEach(function (item) {
    const key = groupKey(item.type);
    if (!byGroup[key]) byGroup[key] = [];
    byGroup[key].push(item);
  });
  const fragment = document.createDocumentFragment();
  GROUP_ORDER.forEach(function (key) {
    const groupItems = byGroup[key];
    if (!groupItems || groupItems.length === 0) return;
    const title = document.createElement('h2');
    title.className = 'group-title';
    title.textContent = TYPE_GROUPS[key].label;
    fragment.appendChild(title);
    groupItems.forEach(function (item) {
      const row = document.createElement('div');
      row.className = 'item-row';
      const name = document.createElement('span');
      name.className = 'item-title';
      name.textContent = item.title;
      row.appendChild(name);
      const page = TYPE_GROUPS[key].page;
      if (page) {
        const link = document.createElement('a');
        link.href = page + '?course_id=' + encodeURIComponent(currentCourse.id);
        link.textContent = '\u8FDB\u5165';
        row.appendChild(link);
      }
      fragment.appendChild(row);
    });
  });
  groups.appendChild(fragment);
}

document.getElementById('back-link').addEventListener('click', function () {
  document.getElementById('detail-section').style.display = 'none';
  document.getElementById('list-section').style.display = 'block';
  loadCourses();
});

loadCourses();
</script>
</body>
</html>
