<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结业证书 - 课程学习</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/vars.css">
<link rel="stylesheet" href="../assets/css/course.css">
<style>
  /* Page-specific: certificate display box */
  .cert {
    background: var(--surface);
    border: 2px solid var(--accent);
    border-radius: 8px;
    padding: var(--space-xl);
    margin: var(--space-lg) 0;
    text-align: center;
  }
  .cert h2 { font-family: var(--font-latin); color: var(--accent); margin-bottom: var(--space-sm); }
  .cert p { color: var(--text); margin-bottom: var(--space-xs); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-brand">
    <span class="topbar-brand-mark">Oikos</span>
    <span class="topbar-brand-text">课程学习</span>
  </div>
  <nav class="topbar-nav">
    <a href="../index.html" class="topbar-nav-link">返回前台</a>
  </nav>
</header>
<div class="page-layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">学生</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">仪表盘</a>
        <a href="courses.html" class="sidebar-link">我的课程</a>
        <a href="assignments.html" class="sidebar-link">作业</a>
        <a href="assessments.html" class="sidebar-link">考核</a>
        <a href="grades.html" class="sidebar-link">成绩</a>
        <a href="certificate.html" class="sidebar-link active">证书</a>
      </nav>
    </div>
  </aside>
  <main class="main-content">
    <div class="main-header">
      <div class="main-eyebrow">Testimonium</div>
      <h1 class="main-title">结业证书</h1>
      <p class="main-lede">完成全部课程进度后，可申请结业证书。</p>
    </div>
    <div id="loading" class="loading">加载中...</div>
    <div id="error-msg" class="error-msg" style="display:none"></div>
    <div id="cert-status" class="card">
      <p>课程进度: <span id="progress">--</span></p>
      <button class="btn btn-primary" id="btn-apply" disabled>申请结业</button>
    </div>
    <div class="cert" id="cert-display" style="display:none">
      <h2>Scriptorium</h2>
      <p>结业证书</p>
      <p id="cert-name"></p>
      <p id="cert-course"></p>
      <p id="cert-date"></p>
    </div>
  </main>
</div>
<script type="module">
import CourseAuth from '../assets/js/auth.js';
if (!CourseAuth.requireAuth()) throw new Error('redirecting');
const token = CourseAuth.getToken();
let courseId = new URLSearchParams(location.search).get('course_id');
async function loadCert() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('error-msg').style.display = 'none';
  try {
    const profile = await CourseAuth.getProfile();
    if (profile) document.getElementById('cert-name').textContent = profile.nickname || profile.email;
  } catch (err) {
    document.getElementById('error-msg').textContent = err.message || '加载失败，请稍后重试';
    document.getElementById('error-msg').style.display = 'block';
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}
async function loadProgress() {
  if (!courseId) {
    try {
      const res = await fetch('/api/modules/certificates', { headers: { Authorization: 'Bearer ' + token } });
      if (res.ok) {
        const data = await res.json();
        const certs = data.certificates || [];
        if (certs.length > 0) courseId = certs[0].course_id;
      }
    } catch (err) {}
  }
  if (!courseId) {
    document.getElementById('error-msg').textContent = '未指定课程，请从课程页面进入';
    document.getElementById('error-msg').style.display = 'block';
    return;
  }
  try {
    const res = await fetch('/api/modules/students/progress?course_id=' + encodeURIComponent(courseId), { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) { const errData = await res.json().catch(() => ({})); throw new Error(errData.error || '加载失败'); }
    const data = await res.json();
    const percent = data.summary && data.summary.percent !== undefined ? data.summary.percent : 0;
    document.getElementById('progress').textContent = percent + '%';
    if (percent >= 100) document.getElementById('btn-apply').disabled = false;
  } catch (err) {
    document.getElementById('error-msg').textContent = err.message || '加载失败，请稍后重试';
    document.getElementById('error-msg').style.display = 'block';
  }
}
document.getElementById('btn-apply').addEventListener('click', async function () {
  this.disabled = true;
  try {
    const res = await fetch('/api/modules/certificates', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ courseId })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      this.disabled = false;
      alert(data.error || '申请失败，请稍后重试');
      return;
    }
    this.textContent = '已申请，等待审核';
  } catch (err) {
    this.disabled = false;
    alert('网络错误，请稍后重试');
  }
});
loadCert();
loadProgress();
</script>
</body>
</html>
