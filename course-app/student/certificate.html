<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>结业证书 - 课程学习</title><link rel="stylesheet" href="../assets/css/vars.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}.topbar a{color:var(--muted);text-decoration:none;font-size:14px}.container{max-width:600px;margin:0 auto;padding:var(--space-lg);text-align:center}h1{font-size:22px;margin-bottom:var(--space-md)}.cert{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:var(--space-xl);margin:var(--space-lg) 0}.cert h2{font-family:var(--font-latin);color:var(--accent)}.btn{padding:10px 24px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:15px}.btn:disabled{opacity:.5;cursor:not-allowed}.loading{color:var(--muted);font-size:14px}.error-msg{color:#c62828;background:#ffebee;padding:var(--space-sm);border-radius:4px;font-size:14px}</style></head><body><div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div><div class="container"><h1>结业证书</h1><div id="loading" class="loading">加载中...</div><div id="error-msg" class="error-msg" style="display:none"></div><div id="cert-status"><p>课程进度: <span id="progress">--</span></p><button class="btn" id="btn-apply" disabled>申请结业</button></div><div class="cert" id="cert-display" style="display:none"><h2>Scriptorium</h2><p>结业证书</p><p id="cert-name"></p><p id="cert-course"></p><p id="cert-date"></p></div></div><script type="module">import CourseAuth from '../assets/js/auth.js';if(!CourseAuth.requireAuth())throw new Error('redirecting');const token=CourseAuth.getToken();let courseId=new URLSearchParams(location.search).get('course_id');async function loadCert(){document.getElementById('loading').style.display='block';document.getElementById('error-msg').style.display='none';try{const profile=await CourseAuth.getProfile();if(profile)document.getElementById('cert-name').textContent=profile.nickname||profile.email;}catch(err){document.getElementById('error-msg').textContent=err.message||'加载失败，请稍后重试';document.getElementById('error-msg').style.display='block';}finally{document.getElementById('loading').style.display='none';}}async function loadProgress(){if(!courseId){try{const res=await fetch('/api/modules/certificates',{headers:{Authorization:'Bearer '+token}});if(res.ok){const data=await res.json();const certs=data.certificates||[];if(certs.length>0)courseId=certs[0].course_id;}}catch(err){}}if(!courseId){document.getElementById('error-msg').textContent='未指定课程，请从课程页面进入';document.getElementById('error-msg').style.display='block';return;}try{const res=await fetch('/api/modules/students/progress?course_id='+encodeURIComponent(courseId),{headers:{Authorization:'Bearer '+token}});if(!res.ok){const errData=await res.json().catch(()=>({}));throw new Error(errData.error||'加载失败');}const data=await res.json();const percent=data.summary&&data.summary.percent!==undefined?data.summary.percent:0;document.getElementById('progress').textContent=percent+'%';if(percent>=100)document.getElementById('btn-apply').disabled=false;}catch(err){document.getElementById('error-msg').textContent=err.message||'加载失败，请稍后重试';document.getElementById('error-msg').style.display='block';}}document.getElementById('btn-apply').addEventListener('click',async function(){this.disabled=true;try{const res=await fetch('/api/modules/certificates',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({courseId})});const data=await res.json().catch(()=>({}));if(!res.ok){this.disabled=false;alert(data.error||'申请失败，请稍后重试');return;}this.textContent='已申请，等待审核';}catch(err){this.disabled=false;alert('网络错误，请稍后重试');}});loadCert();loadProgress();</script></body></html>
