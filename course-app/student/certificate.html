<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>结业证书 - 课程学习</title><link rel="stylesheet" href="../assets/css/vars.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}.topbar a{color:var(--muted);text-decoration:none;font-size:14px}.container{max-width:600px;margin:0 auto;padding:var(--space-lg);text-align:center}h1{font-size:22px;margin-bottom:var(--space-md)}.cert{background:var(--surface);border:2px solid var(--accent);border-radius:8px;padding:var(--space-xl);margin:var(--space-lg) 0}.cert h2{font-family:var(--font-latin);color:var(--accent)}.btn{padding:10px 24px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:15px}.btn:disabled{opacity:.5;cursor:not-allowed}</style></head><body><div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div><div class="container"><h1>结业证书</h1><div id="cert-status"><p>课程进度: <span id="progress">--</span></p><button class="btn" id="btn-apply" disabled>申请结业</button></div><div class="cert" id="cert-display" style="display:none"><h2>Scriptorium</h2><p>结业证书</p><p id="cert-name"></p><p id="cert-course"></p><p id="cert-date"></p></div></div><script type="module">import CourseAuth from '../assets/js/auth.js';if(!CourseAuth.requireAuth())throw new Error('redirecting');const token=CourseAuth.getToken();async function loadCert(){const profile=await CourseAuth.getProfile();if(profile)document.getElementById('cert-name').textContent=profile.nickname||profile.email;}loadCert();</script></body></html>
