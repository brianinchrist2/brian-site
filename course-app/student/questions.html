<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>问答讨论 - 课程学习</title><link rel="stylesheet" href="../assets/css/vars.css"><style>body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text)}.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--space-md) var(--space-lg);background:var(--surface);border-bottom:1px solid var(--border)}.topbar .brand{font-family:var(--font-latin);color:var(--accent);font-size:18px;font-weight:600}.topbar a{color:var(--muted);text-decoration:none;font-size:14px}.container{max-width:800px;margin:0 auto;padding:var(--space-lg)}h1{font-size:22px;margin-bottom:var(--space-md)}.btn{padding:8px 16px;background:var(--accent);color:var(--surface);border:none;border-radius:4px;cursor:pointer;font-size:14px}.q-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:var(--space-md);margin-bottom:var(--space-sm)}.q-card h3{margin:0 0 var(--space-xs)}.q-card .meta{font-size:13px;color:var(--muted)}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#e3f2fd;color:#1565c0}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center}.modal.active{display:flex}.modal-content{background:var(--surface);padding:var(--space-xl);border-radius:8px;width:100%;max-width:500px}.form-group{margin-bottom:var(--space-md)}.form-group input,.form-group textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:4px;box-sizing:border-box}</style></head><body><div class="topbar"><a href="../index.html" class="brand">Scriptorium</a><a href="../index.html">返回首页</a></div><div class="container"><div style="display:flex;justify-content:space-between;align-items:center"><h1>问答讨论</h1><button class="btn" id="btn-ask">提问</button></div><div id="questions-list"></div></div><div class="modal" id="modal-ask"><div class="modal-content"><h2>新问题</h2><div class="form-group"><label>标题</label><input type="text" id="q-title"></div><div class="form-group"><label>内容</label><textarea id="q-body" rows="4"></textarea></div><div class="form-group"><label>课程ID</label><input type="text" id="q-course"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="btn-cancel" style="background:var(--muted)">取消</button><button class="btn" id="btn-submit">提交</button></div></div></div><script type="module">import CourseAuth from '../assets/js/auth.js';if(!CourseAuth.requireAuth())throw new Error('redirecting');const token=CourseAuth.getToken();const modal=document.getElementById('modal-ask');async function loadQuestions(){const res=await fetch('/api/modules/interactions/questions',{headers:{Authorization:'Bearer '+token}});const data=await res.json();const list=document.getElementById('questions-list');if(!data.questions||data.questions.length===0){list.innerHTML='<p>暂无问题</p>';return;}list.innerHTML=data.questions.map(function(q){return '<div class="q-card"><h3>'+q.title+'</h3><div class="meta">'+(q.has_official?'<span class="badge">已回答</span> ':'')+q.status+'</div><p>'+(q.body||'')+'</p></div>';}).join('');}document.getElementById('btn-ask').addEventListener('click',function(){modal.classList.add('active');});document.getElementById('btn-cancel').addEventListener('click',function(){modal.classList.remove('active');});document.getElementById('btn-submit').addEventListener('click',async function(){await fetch('/api/modules/interactions/questions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({course_id:document.getElementById('q-course').value,title:document.getElementById('q-title').value,body:document.getElementById('q-body').value})});modal.classList.remove('active');loadQuestions();});loadQuestions();</script></body></html>
