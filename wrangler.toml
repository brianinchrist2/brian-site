# Course system deployment (separate from blog site which uses wrangler-blog.toml)
# Blog: npx wrangler pages deploy --config wrangler-blog.toml (deploys brianinchrist/ to brianinchrist-site)
# Courses: npx wrangler pages deploy (deploys course-app/ to brianinchrist-courses)
#:schema node_modules/wrangler/config-schema.json
name = "brianinchrist-courses"
pages_build_output_dir = "course-app"

[[kv_namespaces]]
binding = "USERS_KV"
id = "b8ae6043b8784ce59fdbd602e4c2da0c"

[[d1_databases]]
binding = "DB"
database_name = "brianinchrist-db"
database_id = "0d035c3d-d7f0-47ad-b733-c4cacab516f2"

[vars]
JWT_SECRET = "a_very_long_secure_random_key_for_jwt_auth_1298471928"
